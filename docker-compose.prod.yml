services:
    web:
        build:
            context: ./project
            dockerfile: Dockerfile.prod
        command: gunicorn --bind 0.0.0.0:8000 app.main:app -k uvicorn.workers.UvicornWorker
        ports:
            - 8004:8000
        environment:
            - DATABASE_URL=postgres://postgres:postgres@web-db:5432/web_prod
        depends_on:
            - web-db
    web-db:
        build:
            context: ./project/db
            dockerfile: Dockerfile.prod
        volumes:
        - postgres_data_prod:/var/lib/postgresql/data
        expose:
        - 5432
        environment:
            - POSTGRES_USER=postgres
            - POSTGRES_PASSWORD=postgres

volumes:
    postgres_data_prod: